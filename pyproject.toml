[project]
name = "agentquest"
version = "0.1.0"
description = "Turn-based AI adventurer game — Milestone 1 manual prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
# The optional cache can be inaccessible on managed Windows workspaces.
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
